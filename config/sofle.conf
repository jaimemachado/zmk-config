CONFIG_ZMK_KEYBOARD_NAME="JMN-H"

# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
# CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=1
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=1
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=1
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# Use the STRIP config specific to the LEDs you're using


# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n


# Uncomment the following line to after compiling both to get left wpm tracking
#CONFIG_ZMK_WPM=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=y

#Increase Max Combo to Account For Shift Use
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=20


CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# nice!oled custom status screen (zmk-nice-oled module, see config/west.yml)
# Options: https://github.com/mctechnology17/zmk-nice-oled#configuration
# Based on the module's "Full Features" preset (docs/OPTIMIZE.md)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Memory/thread sizing for all widgets + Raw HID
CONFIG_LV_Z_MEM_POOL_SIZE=12288
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=5120

# Left (central) screen, 32x128 px vertical. Top to bottom:
#   y=32 USB/BT + profile number, y=50 battery %, y=68-104 Raw HID
#   (clock, layout, volume), y=105-135 modifiers 2x2, y=137 profile dots,
#   y=146 layer name. No Bongo Cat: it covers the Raw HID area.
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n
# Caps lock indicator
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
# Ctrl/Shift/Alt/Super icons in a 2x2 grid. The module has no Linux style;
# the Windows style (Ctrl, Shift, Alt, Win logo = Super) is closest.
# The vertical layout is not usable on a 32 px wide OLED (it draws off-screen).
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=1
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=105
# Current layer; battery uses the default widget (y=50) because the
# "both halves" battery text is drawn above the visible area
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Raw HID: needs the zmk-hid-host app running on the computer
# (https://github.com/mctechnology17/zmk-nice-oled/tree/main/ZMK_RAW_HID)
CONFIG_NICE_OLED_WIDGET_RAW_HID=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_CUSTOM_Y=68
CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME_CUSTOM_Y=68
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT_CUSTOM_Y=80
# Names shown for each layout index sent by zmk-hid-host; keep the same
# order as "layouts" in zmk-hid-host.json (English, Spanish, Portuguese BR)
CONFIG_NICE_OLED_WIDGET_RAW_HID_LAYOUT_LIST="EN,ES,PTBR"
CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME=y
CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME_CUSTOM_Y=92
# Weather and Spotify text don't fit on this screen
CONFIG_NICE_OLED_WIDGET_RAW_HID_WEATHER=n
CONFIG_NICE_OLED_WIDGET_RAW_HID_MEDIA_PLAYER_SPOTIFY_MACOS=n

# Right (peripheral) screen: looping cat animation
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# Both screens: show sleep art when idle / asleep
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Note: don't set CONFIG_BT_MAX_PAIRED here. ZMK's split default (6) already
# covers 5 host profiles (BT1-BT5) plus 1 bond for the right half.

# Key debounce: a 1 ms press debounce can register switch bounce as double
# letters (chatter); use ZMK's default press time and a longer release time
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
#CONFIG_ZMK_USB_LOGGING=y
#CONFIG_ZMK_LOG_LEVEL_DBG=y

# Uncomment the following line if you facing issue on win 11 connection
# Enables a combination of settings that are planned to be default in future versions of ZMK to improve connection stability. This includes changes to timing on BLE pairing initiation, restores use of the updated/new LLCP implementation, and disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# CONFIG_ZMK_WPM=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=y
