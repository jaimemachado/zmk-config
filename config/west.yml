  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to v0.3.0: zmk-nice-oled is only tested against ZMK v0.3.0
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-nice-oled
      remote: mctechnology17
      # Pinned to a known commit so upstream changes can't break the build
      revision: 46f824abb2bd41f1287c5c68abd14122af6042a3
  self:
    path: config
